<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Training Portal · Login</title>
<link rel="stylesheet" href="/css/main.css">
<style>
  body { display: flex; align-items: center; justify-content: center; min-height: 100vh; background: var(--ox-bg); }
  .login-wrap { width: 100%; max-width: 400px; padding: 24px; }
  .login-logo { text-align: center; margin-bottom: 32px; }
  .login-logo .brand { font-size: 32px; }
  .login-logo .brand-sub { margin-top: 4px; }
  .login-card { background: #fff; border: 1px solid var(--ox-border); border-radius: 16px; padding: 32px; }
  .login-title { font-family: 'DM Serif Display', serif; font-size: 22px; margin-bottom: 6px; }
  .login-sub { font-size: 13px; color: var(--ox-muted); margin-bottom: 24px; }
  .login-footer { text-align: center; margin-top: 20px; font-size: 12px; color: var(--ox-muted); }
  .error-msg { background: var(--ox-log-bg); color: var(--ox-log-text); border-radius: 8px; padding: 10px 14px; font-size: 13px; margin-bottom: 16px; display: none; }
</style>
</head>
<body>
<div class="login-wrap">
  <div class="login-logo">
    <div class="brand" style="font-family:'DM Serif Display',serif;font-size:32px;letter-spacing:.04em;">Training<span style="color:var(--ox-gold);">Portal</span></div>
    <div class="brand-sub" style="font-size:10px;color:var(--ox-muted);letter-spacing:.14em;text-transform:uppercase;margin-top:4px;">Internal Training Platform</div>
  </div>
  <div class="login-card">
    <div class="login-title">Sign in</div>
    <div class="login-sub">Enter your company email to access</div>
    <div class="error-msg" id="errorMsg"></div>
    <form id="loginForm">
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-input" placeholder="you@acme-corp.example" required autocomplete="email">
      </div>
      <div class="form-group">
        <label class="form-label">Password</label>
        <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
      </div>
      <button type="submit" class="btn btn-primary w-full" id="loginBtn" style="width:100%;margin-top:8px;justify-content:center;display:flex;">
        Sign in
      </button>
    </form>
  </div>
  <div class="login-footer">Having trouble signing in? Contact your system administrator.</div>
</div>
<script>
document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('errorMsg');
  btn.textContent = 'Signing in...';
  btn.disabled = true;
  errEl.style.display = 'none';

  const res = await fetch('/api/auth/login', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value })
  });
  const data = await res.json();

  if (data.success) {
    window.location.href = data.redirect;
  } else {
    errEl.textContent = data.error;
    errEl.style.display = 'block';
    btn.textContent = 'Sign in';
    btn.disabled = false;
  }
});
</script>
</body>
</html>
